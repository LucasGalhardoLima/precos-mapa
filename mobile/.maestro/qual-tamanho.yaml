# Resposta → bloco QUAL TAMANHO. Só leitura. Fixado por id (produtos com família
# de tamanhos E preço de hoje, achados por consulta read-only em 12/11/2026; o
# "primeiro arroz" da busca não serve, ver histórico no git). Se o catálogo mudar,
# repita a busca de dados e troque os ids.
#   - Fanta Laranja Lata 220ml: há irmão mais barato por ml → lista de alternativas
#     ("menor no <loja>");
#   - Lasanha Sadia 1 kg: nenhum irmão bate o tamanho atual → fallback "é o melhor por kg".
appId: com.poup.consumer
---
- runFlow: _ate-raiz.yaml
- runFlow:
    file: _abrir.yaml
    env:
      URL: "poup://product/645906f8-69ea-43c9-953a-2be8ab6d0904"
- extendedWaitUntil:
    visible: "ONDE"
    timeout: 20000
- scrollUntilVisible:
    element: "preços de hoje, 03:00.*|últimos preços vistos.*"
    timeout: 10000
- assertVisible: ".*menor no .*"
- takeScreenshot: qual-tamanho-alternativas
# Fallback: o tamanho atual já é o melhor por unidade.
- runFlow:
    file: _abrir.yaml
    env:
      URL: "poup://product/0353c2e5-b672-4d97-b4a9-3daca0ee9cb7"
- extendedWaitUntil:
    visible: "ONDE"
    timeout: 20000
- scrollUntilVisible:
    element: "preços de hoje, 03:00.*|últimos preços vistos.*"
    timeout: 10000
- assertVisible: ".*é o melhor por (kg|litro|unidade|m).*"
- takeScreenshot: qual-tamanho-melhor
