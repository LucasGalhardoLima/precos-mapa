# Busca na raiz → Resultado → toque num produto → tela Resposta (bloco ONDE).
# Depende de dados reais do Supabase: precisa de rede e de "leite" no catálogo.
appId: com.poup.consumer
---
- runFlow: _launch.yaml
- tapOn: "Digitar minha cidade.*"
- tapOn: "digite sua cidade"
- inputText: "Matão"
- tapOn: "Matão, SP"
# Não usar o link "Buscar agora" aqui: no dev client o botão flutuante "Tools"
# fica por cima dele e o toque abre o menu de dev. Finaliza pelo botão de baixo.
# Sem escolher item: com item, concluir o onboarding cria usuário anônimo e linha
# em tracked_items em produção. Busca e Resposta não dependem de item acompanhado.
- tapOn: "Ver preços de hoje.*"
- extendedWaitUntil:
    visible: "Preços de hoje nos 4 mercados de Matão"
    timeout: 20000
- tapOn: "buscar produto"
- inputText: "leite"
# Não casar com o texto "leite" do próprio campo: espera a contagem sair de zero.
- extendedWaitUntil:
    visible: "[1-9][0-9]* PRODUTO.*"
    timeout: 20000
- takeScreenshot: resultado-leite
# Cada linha de resultado é um único elemento de acessibilidade:
# "<nome>, menor no <loja>, R$ <preço>" (ou "só no <loja>"). Toca na primeira.
- tapOn: ".*, (menor|só) no .*, R\\$.*"
- extendedWaitUntil:
    visible: "ONDE"
    timeout: 20000
- takeScreenshot: resposta-produto
