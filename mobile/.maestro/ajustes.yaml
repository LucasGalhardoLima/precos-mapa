# Raiz → engrenagem → Ajustes → folha "trocar" → volta. Só leitura e navegação:
# não toca em "acompanhar" (isso criaria usuário anônimo e linha em produção),
# então remover/desfazer e o estado "notificação bloqueada" ficam sem cobertura E2E.
# Depende de rede (os 4 mercados da folha vêm do Supabase).
appId: com.poup.consumer
---
- runFlow: _launch.yaml
- tapOn: "Digitar minha cidade.*"
- tapOn: "digite sua cidade"
- inputText: "Matão"
- tapOn: "Matão, SP"
# Sem escolher item: o botão do passo 2 segue para a raiz dia zero.
- tapOn: "Ver preços de hoje.*"
- extendedWaitUntil:
    visible: "Preços de hoje nos 4 mercados de Matão"
    timeout: 20000
# No dev client o botão flutuante "Tools" cobre a engrenagem inteira (nem a borda
# fica livre: toque por ponto abriu o menu de dev). Entra por deep link; o toque
# na engrenagem em si fica sem cobertura E2E enquanto for dev client.
- openLink: "poup://settings"
# O iOS pergunta "Open in Poup?" ao abrir o esquema por link (nem sempre aparece).
- runFlow:
    when:
      visible: "Open in.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "ITENS ACOMPANHADOS.*"
    timeout: 20000
- assertVisible: "LOCALIZAÇÃO"
- assertVisible: "NOTIFICAÇÕES"
- assertVisible: "Avisar quando um item baixar"
- assertVisible: "sobre"
- assertVisible: "termos"
- takeScreenshot: ajustes
# Folha "trocar" (os 4 mercados) abre e fecha sem mudar nada.
- tapOn: "trocar"
- extendedWaitUntil:
    visible: "Trocar mercado"
    timeout: 20000
- tapOn: "voltar"
- assertVisible: "LOCALIZAÇÃO"
# Volta para a raiz.
- tapOn: "voltar"
- assertVisible: "Preços de hoje nos 4 mercados de Matão"
