# Sub-flow compartilhado: app zerado (onboarding de novo) conectado ao Metro.
# Dev client: o clearState apaga também o servidor lembrado, então reconecta por link.
# Metro precisa estar de pé: `npx expo start --dev-client`.
appId: com.poup.consumer
---
- launchApp:
    clearState: true
- openLink: "exp+poup://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
# Corrida: o iOS pergunta "Open in Poup?" ao abrir o esquema por link, mas o
# diálogo pode demorar ou nem vir. Um `when: visible` direto é avaliado antes de
# ele surgir; por isso espera (opcional) por um dos três estados possíveis e só
# então trata cada um, em ordem. Depois de tocar em "Open" pode vir o aviso do
# menu de desenvolvedor, que também só surge depois que o Metro termina o bundle.
- extendedWaitUntil:
    visible: "Open in.*|Continue|Digitar minha cidade.*"
    timeout: 90000
- runFlow:
    when:
      visible: "Open in.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Continue|Digitar minha cidade.*"
    timeout: 90000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      # O menu abre em seguida e cobre a tela; o ✕ não tem rótulo de acessibilidade.
      - tapOn:
          point: "90%,48%"
- extendedWaitUntil:
    visible: "Digitar minha cidade.*"
    timeout: 60000
